      document.head.appendChild(translateScript);

      // Remove listeners
      ['scroll', 'mousemove', 'touchstart', 'click', 'keydown'].forEach(evt => {
        window.removeEventListener(evt, loadThirdPartyScripts, { passive: true });
      });
    }

    // Attach listeners
    ['scroll', 'mousemove', 'touchstart', 'click', 'keydown'].forEach(evt => {
      window.addEventListener(evt, loadThirdPartyScripts, { once: true, passive: true });
    });
    
    // Fallback if no interaction happens after 8.5s post-load

      setTimeout(loadThirdPartyScripts, 8500);
    });
